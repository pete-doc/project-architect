[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["plugin", "tests"]
exclude = ["tests/projects", "**/__pycache__"]
extraPaths = ["plugin/hooks", "plugin/skills/adr/scripts", "plugin/templates/ci/parch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["projects"]
# Параметризованный тест с пустым набором параметров не должен молча пропускаться.
empty_parameter_set_mark = "fail_at_collect"
pythonpath = ["plugin/hooks", "plugin/templates/ci/parch"]
