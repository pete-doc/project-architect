[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["plugin", "tests"]
extraPaths = ["plugin/hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugin/hooks"]
