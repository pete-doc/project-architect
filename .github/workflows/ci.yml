name: ci

# Быстрая часть на каждую отправку (ADR-0013): проверки, быстрые тесты и медленные тесты только тех
# языков, чьи файлы изменил PR. Такой прогон помечен как урезанный и права на слияние не даёт:
# слияние подтверждает полный прогон (full.yml, проверка full-run: `gh pr ready`).
# Раннеры: Ubuntu по умолчанию. Другие раннеры, матрицы и запуск не по pull_request добавляются
# только через ADR с оценкой минут квоты (ADR-0011): Windows считается как x2, macOS как x10.
# Прогона на push в main нет: ветка main защищена, в неё попадает только проверенное.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Что изменил PR: нужны ли тесты, hooks на Windows и какие языки менялись.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      hooks: ${{ steps.files.outputs.hooks }}
      node: ${{ steps.files.outputs.node }}
      csharp: ${{ steps.files.outputs.csharp }}
      powershell: ${{ steps.files.outputs.powershell }}
      selector: ${{ steps.files.outputs.selector }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if files=$(gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --name-only); then
            echo "$files" | python3 .github/scope.py | tee -a "$GITHUB_OUTPUT"
          else
            echo "Не удалось получить список файлов PR: идут проверки всех языков."
            python3 .github/scope.py --unknown | tee -a "$GITHUB_OUTPUT"
          fi

  check:
    needs: scope
    runs-on: ubuntu-latest
    # 25: если PR меняет общий код или сам CI, идут тесты всех языков и прогон не короче полного.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Стоимость CI и бюджет текста (STANDARD.md, 7.2 и 12): таймауты, отмена, триггеры, раннеры.
      - run: python plugin/templates/ci/parch/parch_ci.py standard

      # PR только с docs/** и state/**: тестов нет, проверяется структура (манифесты плагина,
      # индекс ADR, чистота стиля) и согласованность baseline с тестами.
      - name: Структура (PR только с docs и state)
        if: needs.scope.outputs.code != 'true'
        run: >
          pytest -q tests/test_plugin_manifest.py tests/test_style_gate.py
          tests/test_skills.py::test_product_adr_index_is_up_to_date
      - name: Согласованность baseline (PR только с docs и state)
        if: needs.scope.outputs.code != 'true'
        run: python plugin/templates/ci/parch/parch_ci.py tests --language python

      # Урезанный прогон: PR меняет код, тесты, плагин или настройки.
      - if: needs.scope.outputs.code == 'true' && needs.scope.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/projects/ts_shop/package-lock.json
      # Тесты C# запускают настоящий dotnet; версия SDK закреплена точно в global.json тестового проекта.
      - if: needs.scope.outputs.code == 'true' && needs.scope.outputs.csharp == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-sdk-${{ runner.os }}-${{ hashFiles('tests/projects/cs_shop/global.json') }}
      - if: needs.scope.outputs.code == 'true' && needs.scope.outputs.csharp == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: tests/projects/cs_shop/global.json
          cache: true
          cache-dependency-path: tests/projects/cs_shop/**/packages.lock.json
      # Тесты PowerShell запускают настоящий PSScriptAnalyzer; версия та же, что в шаблоне CI.
      - id: psa-cache
        if: needs.scope.outputs.code == 'true' && needs.scope.outputs.powershell == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psscriptanalyzer-${{ runner.os }}-1.25.0
      - name: Install PSScriptAnalyzer
        if: needs.scope.outputs.code == 'true' && needs.scope.outputs.powershell == 'true' && steps.psa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - if: needs.scope.outputs.code == 'true'
        run: pyright
      # Метка parch-partial в отчёте: храповик не примет его за полный прогон.
      - name: Урезанный прогон тестов
        if: needs.scope.outputs.code == 'true'
        env:
          SELECTOR: ${{ needs.scope.outputs.selector }}
        run: pytest -v -m "$SELECTOR" -o junit_suite_name=parch-partial --junitxml=test-report-partial.xml
      - if: always() && needs.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-report-partial
          path: test-report-partial.xml
          retention-days: 7
      # «Храповик» в режиме --partial: упавшие, новые пропуски и удалённые тесты останавливают и
      # урезанный прогон, но он сообщает, что слияния не даёт.
      - if: needs.scope.outputs.code == 'true'
        run: python plugin/templates/ci/parch/parch_ci.py tests --language python --partial --report test-report-partial.xml
      - if: needs.scope.outputs.code == 'true'
        run: python plugin/templates/ci/parch/parch_ci.py skips --language python --partial --report test-report-partial.xml

  # Целевая платформа продукта Windows 11: hooks и запускающий файл проверяются на Windows,
  # но только если PR их меняет (Windows считается как x2 к квоте).
  windows-hooks:
    needs: scope
    if: needs.scope.outputs.hooks == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v tests/test_guards.py tests/test_launcher.py tests/test_flow.py
