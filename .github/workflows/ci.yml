name: ci

# Раннеры: Ubuntu по умолчанию. Другие раннеры, матрицы и запуск не по pull_request добавляются
# только через ADR с оценкой минут квоты за один прогон (ADR-0011): Windows считается как x2,
# macOS как x10. Прогона на push в main нет: ветка main защищена, в неё попадает только проверенное.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Что изменил PR: определяет, нужны ли полные проверки и проверка hooks на Windows.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      hooks: ${{ steps.files.outputs.hooks }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=false
          hooks=false
          if ! files=$(gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --name-only); then
            echo "Не удалось получить список файлов PR: идут полные проверки."
            code=true
            hooks=true
          fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|state/*) ;;
              *) code=true ;;
            esac
            case "$file" in
              plugin/hooks/*|plugin/templates/*|.github/*) hooks=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "hooks=$hooks" >> "$GITHUB_OUTPUT"
          echo "PR меняет код или тесты: $code; hooks, шаблоны или .github: $hooks"

  check:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Стоимость CI и бюджет текста (STANDARD.md, 7.2 и 12): таймауты, отмена, триггеры, раннеры.
      - run: python plugin/templates/ci/parch/parch_ci.py standard

      # PR только с docs/** и state/**: тестов нет, проверяется структура (манифесты плагина,
      # индекс ADR, чистота стиля) и согласованность baseline с тестами.
      - name: Структура (PR только с docs и state)
        if: needs.scope.outputs.code != 'true'
        run: >
          pytest -q tests/test_plugin_manifest.py tests/test_style_gate.py
          tests/test_skills.py::test_product_adr_index_is_up_to_date
      - name: Согласованность baseline (PR только с docs и state)
        if: needs.scope.outputs.code != 'true'
        run: python plugin/templates/ci/parch/parch_ci.py tests --language python

      # Полные проверки: PR меняет код, тесты, плагин или настройки.
      - if: needs.scope.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/projects/ts_shop/package-lock.json
      # Тесты C# запускают настоящий dotnet; версия SDK закреплена точно в global.json тестового проекта.
      - if: needs.scope.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-sdk-${{ runner.os }}-${{ hashFiles('tests/projects/cs_shop/global.json') }}
      - if: needs.scope.outputs.code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: tests/projects/cs_shop/global.json
          cache: true
          cache-dependency-path: tests/projects/cs_shop/**/packages.lock.json
      # Тесты PowerShell запускают настоящий PSScriptAnalyzer; версия та же, что в шаблоне CI.
      - id: psa-cache
        if: needs.scope.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psscriptanalyzer-${{ runner.os }}-1.25.0
      - name: Install PSScriptAnalyzer
        if: needs.scope.outputs.code == 'true' && steps.psa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - if: needs.scope.outputs.code == 'true'
        run: pyright
      # Полный прогон (-m "" снимает фильтр медленных тестов): единственное место, где он идёт обязательно.
      - if: needs.scope.outputs.code == 'true'
        run: pytest -v -m "" --junitxml=test-report.xml
      # Отчёт нужен и для обновления baseline: пропуски и падения берутся из него, а не из локального прогона.
      - if: always() && needs.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.xml
          retention-days: 14
      # «Храповик» продукта по тем же правилам, что у проектов пользователей: удалённые и
      # пропущенные тесты останавливают CI (baseline в state/baseline.json).
      - if: needs.scope.outputs.code == 'true'
        run: python plugin/templates/ci/parch/parch_ci.py tests --language python --report test-report.xml
      - if: needs.scope.outputs.code == 'true'
        run: python plugin/templates/ci/parch/parch_ci.py skips --language python --report test-report.xml

  # Целевая платформа продукта Windows 11: hooks и запускающий файл проверяются на Windows,
  # но только если PR их меняет (Windows считается как x2 к квоте).
  windows-hooks:
    needs: scope
    if: needs.scope.outputs.hooks == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v tests/test_guards.py tests/test_launcher.py tests/test_flow.py
