  # Табло (ADR-0012, ADR-0022): после слияния в main тесты проекта идут здесь же, а результат публикуется на ветку
  # status. Порядок шагов фиксирован: сначала тесты проекта, потом сборка табло, и только потом ключ записи
  # (add_ssh_keys) и публикация: код проекта (тесты, conftest) выполняется до подключения ключа и ключа не видит.
  # Цвет задания задают только тесты: нет ключа или публикация не удалась это сообщение в журнале, не падение.
  state:
    docker:
      - image: cimg/python:3.12
    resource_class: medium # 2 vCPU, 4 ГБ, 10 кредитов в минуту
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - checkout
