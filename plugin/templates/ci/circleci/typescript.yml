  check-typescript:
    docker:
      - image: cimg/python:3.12 # Python нужен скриптам parch_ci.py; Node ставится точной версии (install-node)
    resource_class: medium # 2 vCPU, 4 ГБ, 10 кредитов в минуту
    steps:
      - checkout
      - fetch-main
      - install-node
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Зависимости (npm ci)
          no_output_timeout: 10m
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run typecheck
      - run: npm run lint
      # Отчёт о запуске тестов формирует сам CI: без него проверки ниже красные.
      - run:
          name: Тесты
          no_output_timeout: 10m
          command: timeout 600 npm test
      - store_artifacts:
          when: always
          path: test-report.json
      - run: python .github/parch/parch_ci.py settings --language typescript
      - run: python .github/parch/parch_ci.py tests --language typescript --report test-report.json
      - run: python .github/parch/parch_ci.py skips --language typescript --report test-report.json
      - run: python .github/parch/parch_ci.py suppressions --language typescript
      - run: python .github/parch/parch_ci.py modules --language typescript
      - run: python .github/parch/parch_ci.py catalog --language typescript
      # Раздел «Основания» берётся из сообщений коммитов ветки (git log origin/main..HEAD), описания PR в CircleCI нет.
      - run:
          name: standard
          no_output_timeout: 5m
          environment:
            PARCH_BASE_REF: origin/main
          command: python .github/parch/parch_ci.py standard --language typescript
      - run: python .github/parch/parch_ci.py deps --language typescript
      - run: python .github/parch/parch_ci.py architecture --language typescript
      - run: python .github/parch/parch_ci.py libraries --language typescript
      - run: python .github/parch/parch_ci.py dead-code --language typescript
      - run: python .github/parch/parch_ci.py duplicates --language typescript
      - run: python .github/parch/parch_ci.py coverage --language typescript

