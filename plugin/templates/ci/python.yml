name: ci

# Раннеры: только ubuntu-latest. Другие раннеры, матрицы и запуск не по pull_request добавляются
# только через ADR с оценкой стоимости (к квоте Windows считается x2, macOS x10).
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest -v
      - run: python .github/parch/parch_ci.py settings
      - run: python .github/parch/parch_ci.py tests
      - run: python .github/parch/parch_ci.py skips
      - run: python .github/parch/parch_ci.py suppressions
      - run: python .github/parch/parch_ci.py modules
      - run: python .github/parch/parch_ci.py deps
      - run: python .github/parch/parch_ci.py architecture
      - run: python .github/parch/parch_ci.py dead-code
      - run: python .github/parch/parch_ci.py duplicates
      - run: python .github/parch/parch_ci.py coverage
