name: ci-powershell

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # PowerShell проверяется на Windows. Облегчённый набор (ADR-0010): скрипты PowerShell только
    # запускают программы, поэтому тестов, покрытия, архитектуры и дублей здесь нет.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Версия PSScriptAnalyzer зафиксирована точно; другая версия делает проверку красной.
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - run: python .github/parch/parch_ci.py psscriptanalyzer --language powershell
      - run: python .github/parch/parch_ci.py thin --language powershell
      - run: python .github/parch/parch_ci.py suppressions --language powershell
      - run: python .github/parch/parch_ci.py settings --language powershell
