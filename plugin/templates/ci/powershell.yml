name: ci-powershell

# Раннеры: только ubuntu-latest (PowerShell 7 работает на нём так же, как на Windows).
# Другие раннеры, матрицы и запуск не по pull_request добавляются только через ADR с оценкой
# стоимости (к квоте Windows считается x2, macOS x10).
# Облегчённый набор (ADR-0010): скрипты PowerShell только запускают программы, поэтому тестов,
# покрытия, архитектуры и дублей здесь нет.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Версия PSScriptAnalyzer зафиксирована точно; другая версия делает проверку красной.
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - run: python .github/parch/parch_ci.py psscriptanalyzer --language powershell
      - run: python .github/parch/parch_ci.py thin --language powershell
      - run: python .github/parch/parch_ci.py catalog --language powershell
      - run: python .github/parch/parch_ci.py standard --language powershell
      - run: python .github/parch/parch_ci.py libraries --language powershell
      - run: python .github/parch/parch_ci.py suppressions --language powershell
      - run: python .github/parch/parch_ci.py settings --language powershell
