name: state

# Пересчёт табло после слияния в main (STANDARD.md, 7.1 и 7.2, правило 6): только маленькое задание,
# без запуска тестов: отчёт берётся из прогона CI того же PR. Табло публикуется на ветке status,
# в main этот workflow ничего не пишет (ADR-0012). Другие раннеры и запуск не по pull_request
# добавляются только через ADR с оценкой стоимости (Windows x2, macOS x10).
on:
  push:
    branches: [main]

concurrency:
  group: state
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Отчёт о тестах из прогона CI этого PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty' || true)
          if [ -n "$pr" ]; then
            head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
            # отчёт даёт полный прогон: у продукта это full.yml, у проектов пользователей ci.yml
            for wf in full.yml ci.yml; do
              run=$(gh run list --workflow "$wf" --commit "$head" --status success --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$run" ] || continue
              if gh run download "$run" -n test-report -D "$RUNNER_TEMP/report"; then
                # отчёт снят на коммите PR; табло честно пишет, если содержимое отличается от main
                git fetch -q origin "pull/$pr/head" || true
                echo "${head::7}" > "$RUNNER_TEMP/report/commit"
                if [ "$(git rev-parse "$head^{tree}" 2>/dev/null)" = "$(git rev-parse 'HEAD^{tree}')" ]; then
                  echo yes > "$RUNNER_TEMP/report/same-tree"
                fi
                break
              fi
              echo "в прогоне $wf нет отчёта о тестах"
            done
          fi
      - name: Прежнее табло и последний известный отчёт
        run: |
          git fetch origin status || true
          if git rev-parse --verify origin/status >/dev/null 2>&1; then
            git show origin/status:state/STATUS.md > "$RUNNER_TEMP/previous.md" || true
            if [ ! -f "$RUNNER_TEMP/report/test-report.xml" ]; then
              # последний известный отчёт: он снят не с этого коммита, коммит отчёта хранится рядом
              git show origin/status:state/test-report.xml > "$RUNNER_TEMP/report/test-report.xml" || true
              git show origin/status:state/test-report.commit > "$RUNNER_TEMP/report/commit" || true
            fi
          fi
      - name: Прогоны Actions за неделю
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '8 days ago' +%Y-%m-%d)
          # pull_requests в данных прогона бывает пустым (например, у слитого PR): ищем PR по ветке
          prmap=$(gh pr list --state all --limit 300 --json number,headRefName --jq 'map({(.headRefName): .number}) | add // {}')
          gh api --paginate -X GET "repos/${{ github.repository }}/actions/runs" -f per_page=100 -f created=">=$since" | jq -c --argjson map "$prmap" '.workflow_runs[] | {id, pr: (.pull_requests[0].number // $map[.head_branch]), created: .created_at, conclusion}' > "$RUNNER_TEMP/runs.jsonl"
          : > "$RUNNER_TEMP/ci-runs.jsonl"
          while IFS= read -r run; do
            id=$(echo "$run" | jq -r .id)
            jobs=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | {labels, started_at, completed_at}]' || echo '[]')
            echo "$run" | jq -c --argjson jobs "$jobs" '. + {jobs: $jobs}' >> "$RUNNER_TEMP/ci-runs.jsonl"
          done < "$RUNNER_TEMP/runs.jsonl"
          jq -s . "$RUNNER_TEMP/ci-runs.jsonl" > "$RUNNER_TEMP/ci-runs.json"
      - name: Открытые PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr list --state open --json number,title,isDraft,labels,statusCheckRollup > "$RUNNER_TEMP/prs.json"
      - name: Табло
        run: |
          same=no
          [ -f "$RUNNER_TEMP/report/same-tree" ] && same=yes
          python .github/parch/parch_status.py --project . \
            --report "$RUNNER_TEMP/report/test-report.xml" \
            --report-commit "$(cat "$RUNNER_TEMP/report/commit" 2>/dev/null || true)" \
            --report-same-tree "$same" \
            --previous "$RUNNER_TEMP/previous.md" --prs "$RUNNER_TEMP/prs.json" \
            --ci-runs "$RUNNER_TEMP/ci-runs.json" \
            --commit "${GITHUB_SHA::7}" --out "$RUNNER_TEMP/STATUS.md"
      - name: Публикация на ветке status
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify origin/status >/dev/null 2>&1; then
            git checkout -q -B status origin/status
          else
            git checkout -q --orphan status
            git rm -rq --cached . || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p state
          cp "$RUNNER_TEMP/STATUS.md" state/STATUS.md
          if [ -f "$RUNNER_TEMP/report/test-report.xml" ]; then
            cp "$RUNNER_TEMP/report/test-report.xml" state/test-report.xml
            [ -f "$RUNNER_TEMP/report/commit" ] && cp "$RUNNER_TEMP/report/commit" state/test-report.commit || true
          fi
          git add state
          git commit -m "state: табло на коммите ${GITHUB_SHA::7}" || echo "табло не изменилось"
          git push origin HEAD:status
